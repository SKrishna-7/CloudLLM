services:
  postgres:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: split_user
      POSTGRES_PASSWORD: split_password
      POSTGRES_DB: split_db
    ports:
    - "127.0.0.1:5433:5432"
    volumes:
    - postgres_data:/var/lib/postgresql/data
  redis:
    image: redis:7
    command: redis-server --requirepass cloudllm_redis_pass
    ports:
    - "127.0.0.1:6380:6379"
    restart: always
    volumes:
    - redis_data:/data
  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
    - "127.0.0.1:9000:9000"
    - "127.0.0.1:9001:9001"
    restart: always
    volumes:
    - minio_data:/data
  prometheus:
    image: prom/prometheus:latest
    volumes:
    - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
    - 9091:9090
    extra_hosts:
    - host.docker.internal:host-gateway
    restart: always
  grafana:
    image: grafana/grafana:latest
    ports:
    - "127.0.0.1:3001:3000"
    environment:
    - GF_SECURITY_ADMIN_PASSWORD=admin
    - GF_SECURITY_ALLOW_EMBEDDING=true
    - GF_AUTH_ANONYMOUS_ENABLED=false
    - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    depends_on:
    - prometheus
    - loki
    restart: always
  loki:
    image: grafana/loki:2.9.0
    ports:
    - 3100:3100
    command: -config.file=/etc/loki/local-config.yaml
    restart: always
  promtail:
    image: grafana/promtail:2.9.0
    volumes:
    - .:/var/log/cloudllm
    - ./promtail-config.yml:/etc/promtail/config.yml
    command: -config.file=/etc/promtail/config.yml
    depends_on:
    - loki
    restart: always
  jaeger:
    image: jaegertracing/all-in-one:latest
    environment:
    - COLLECTOR_OTLP_ENABLED=true
    ports:
    - 16686:16686
    - 4317:4317
    - 4318:4318
    restart: always

volumes:
  postgres_data:
  redis_data:
  minio_data:
